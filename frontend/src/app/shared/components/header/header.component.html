<header>
  <div class="header-left">
    <a routerLink="/app" class="logo">
      <span class="logo-exec">Exec</span><span class="logo-team">Team</span>
    </a>

    <nav>
      <a routerLink="/app" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Проекты
      </a>
      <a routerLink="/app/tasks" routerLinkActive="active">Задачи</a>
      <a routerLink="/app/repos" routerLinkActive="active">Репозитории</a>
      <a routerLink="/app/monitoring" routerLinkActive="active">Мониторинг</a>
    </nav>
  </div>

  <div class="header-right">
    <div class="search">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="M21 21l-4.35-4.35" />
      </svg>
      <input type="text" placeholder="Поиск..." />
    </div>

    <div class="user-menu">
      @if (userName) {
        <div class="avatar">{{ getInitials() }}</div>
        <div class="user-info">
          <span class="name">{{ userName }}</span>
          <span class="email">{{ userEmail }}</span>
        </div>
      } @else {
        <div class="avatar">?</div>
      }

      <button class="logout-btn" (click)="logout()">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </div>
</header>
