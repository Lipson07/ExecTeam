<app-header></app-header>

<main>
  <div class="empty-state">
    <div class="empty-icon">
      <svg
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
        <line x1="12" y1="8" x2="12" y2="16" />
        <line x1="8" y1="12" x2="16" y2="12" />
      </svg>
    </div>
    <h2>Добро пожаловать в ExecTeam</h2>
    <p>Создайте свой первый проект или присоединитесь к существующему</p>
    <div class="actions">
      <button class="btn-primary" (click)="openCreateModal()">Создать проект</button>
      <button class="btn-outline">Присоединиться</button>
    </div>
  </div>
</main>

<app-footer></app-footer>

@if (showCreateModal()) {
  <app-project-create (close)="closeCreateModal()"></app-project-create>
}
